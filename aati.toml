[package]
name = "lipi"
version = "1.0.0"
authors = ["Lipi Contributors"]
edition = "2026"
description = "Self-hosted bilingual (Bengali and English) native systems programming language"
license = "MIT"
repository = "https://github.com/asaudola-cmyk/LiPi_Lang.git"
entry = "src/tools/lipi.lp"

[dependencies]

[build]
target = "x86_64-unknown-linux-musl-freestanding"
compiler = "bin/lipc"
opt_level = 3

[workspace]
members = [
    "aati/crypto_vault",
    "aati/json_toolkit",
    "aati/lipi_ai",
    "aati/lipi_blockchain",
    "aati/lipi_boot",
    "aati/lipi_browser",
    "aati/lipi_dataframe",
    "aati/lipi_engine3d",
    "aati/lipi_fs",
    "aati/lipi_gpu",
    "aati/lipi_grpc",
    "aati/lipi_gui",
    "aati/lipi_http_client",
    "aati/lipi_hypervisor",
    "aati/lipi_ide",
    "aati/lipi_iot",
    "aati/lipi_jwt",
    "aati/lipi_media",
    "aati/lipi_mobile",
    "aati/lipi_p2p",
    "aati/lipi_quantum",
    "aati/lipi_registry",
    "aati/lipi_security",
    "aati/lipi_sql",
    "aati/lipi_swarm",
    "aati/lipi_torch",
    "aati/lipi_web",
    "aati/lipidb",
    "aati/math_extra",
    "aati/sovereign_mesh",
    "aati/web_router"
]

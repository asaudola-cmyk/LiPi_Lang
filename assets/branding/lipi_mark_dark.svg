  <!-- Centered Logo Group -->
  <g transform="translate(145, 140)">
    <rect x="50" y="30" width="60" height="200" rx="30" fill="#00C2FF" opacity="0.9" />
    <rect x="50" y="170" width="150" height="60" rx="30" fill="#FF007A" opacity="0.9" />
    <circle cx="150" cy="100" r="40" fill="none" stroke="#FFD700" stroke-width="60" opacity="0.9" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="gradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="gradSecondary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FA709A" />
      <stop offset="100%" stop-color="#FEE140" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#FA709A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#121212" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Deep Dark Background -->
  <rect width="1200" height="630" fill="#121212" />
  <rect width="1200" height="630" fill="url(#bgGlow)" />

  <!-- Logo Mark Container -->
  <rect x="80" y="115" width="400" height="400" rx="80" fill="#181818" stroke="#282828" stroke-width="3" filter="url(#glow)" />
  <g transform="translate(170, 215) scale(0.55)" filter="url(#glow)">
    <path d="M 140 50 L 20 200 L 140 350" fill="none" stroke="url(#gradPrimary)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 200 50 L 300 50 C 360 50 410 100 410 160 C 410 220 360 270 300 270 L 200 270 L 200 350" fill="none" stroke="url(#gradSecondary)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="200" cy="-30" r="28" fill="url(#gradSecondary)" />
  </g>

  <!-- Title & Typography -->
  <text x="540" y="220" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="78" font-weight="900" fill="#FFFFFF" letter-spacing="4">LiPi 2.0</text>
  <text x="540" y="280" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#00F2FE" letter-spacing="2">THE SOVEREIGN PROGRAMMING LANGUAGE</text>
  <text x="540" y="340" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="500" fill="#A0A0B8">100% Pure Native AMD64 Machine Code • Direct Silicon Compiler</text>

  <!-- Badges -->
  <rect x="540" y="390" width="180" height="44" rx="10" fill="#1C1C28" stroke="#00F2FE" stroke-width="2"/>
  <text x="630" y="418" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#00F2FE" text-anchor="middle">0% C • 0% Libc</text>

  <rect x="740" y="390" width="180" height="44" rx="10" fill="#1C1C28" stroke="#FA709A" stroke-width="2"/>
  <text x="830" y="418" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#FA709A" text-anchor="middle">Post-Quantum PQC</text>

  <rect x="940" y="390" width="180" height="44" rx="10" fill="#1C1C28" stroke="#FEE140" stroke-width="2"/>
  <text x="1030" y="418" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#FEE140" text-anchor="middle">130/130 Tests PASS</text>

  <text x="540" y="490" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#686880" letter-spacing="1">Self-Hosting Determinism • io_uring Reactor • HNSW RAG • DRM GPU</text>
</svg>

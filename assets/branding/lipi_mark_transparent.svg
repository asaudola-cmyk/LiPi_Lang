<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <!-- Vibrant Electric Cyan Gradient (Optimized for High-Contrast Dark Themes) -->
    <linearGradient id="lipiCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#0099FF" />
    </linearGradient>
    
    <!-- Radiant Sunset Gold to Coral Gradient -->
    <linearGradient id="lipiGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="45%" stop-color="#FF7700" />
      <stop offset="100%" stop-color="#FFCC00" />
    </linearGradient>
  </defs>

  <!-- Left Code Bracket '<' (Logic & Syntax) -->
  <path d="M 10 8.5 L 2.5 18.5 L 10 28.5" 
        fill="none" 
        stroke="url(#lipiCyan)" 
        stroke-width="3.4" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
        
  <!-- Right LiPi 'P' / Bengali 'ল' Loop (Sovereignty & Language) -->
  <path d="M 16 28.5 L 16 8.5 L 22.5 8.5 C 26.5 8.5 29.5 11 29.5 15.5 C 29.5 20 26.5 22.5 22.5 22.5 L 16 22.5" 
        fill="none" 
        stroke="url(#lipiGold)" 
        stroke-width="3.4" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
        
  <!-- Top Diacritic Dot / Sovereign Bindu -->
  <circle cx="16" cy="3.6" r="2.2" fill="url(#lipiGold)" />
</svg>

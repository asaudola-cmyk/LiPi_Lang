<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Clean Off-White Canvas -->
  <rect width="500" height="500" rx="90" fill="#F4F4F9" />
  
  <!-- Logo Group with Multiply Blend Mode for subtractive color mixing -->
  <!-- Represents L and P interlocking in pure CMYK-inspired typography -->
  <g transform="translate(130, 90)" style="mix-blend-mode: multiply;">
    
    <!-- The Vertical Stem (Used for both L and P) -->
    <rect x="50" y="30" width="60" height="200" rx="30" fill="#00C2FF" opacity="0.8" />
    
    <!-- The Base (Completes the L) -->
    <rect x="50" y="170" width="150" height="60" rx="30" fill="#FF007A" opacity="0.8" />
    
    <!-- The Loop (Completes the P) -->
    <circle cx="150" cy="100" r="40" fill="none" stroke="#FFD700" stroke-width="60" opacity="0.8" />
  </g>

  <!-- High-End Minimalist Typography -->
  <text x="250" y="400" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#1A1A24" text-anchor="middle" letter-spacing="8">LiPi</text>
  <text x="250" y="435" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#7A7A8C" text-anchor="middle" letter-spacing="4">SOVEREIGN PROGRAMMING LANGUAGE</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="lipiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffcc" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield -->
  <rect width="64" height="64" rx="16" fill="#07090e" stroke="#00ffcc" stroke-width="2" />
  
  <!-- Silicon Chip Circuit Lines -->
  <path d="M12 32 H20 M44 32 H52 M32 12 V20 M32 44 V52" stroke="#00ffcc" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <circle cx="20" cy="32" r="2.5" fill="#00ffcc" />
  <circle cx="44" cy="32" r="2.5" fill="#00ffcc" />
  <circle cx="32" cy="20" r="2.5" fill="#8b5cf6" />
  <circle cx="32" cy="44" r="2.5" fill="#f59e0b" />

  <!-- Crown Icon (Sovereign Lipi) -->
  <path d="M18 42 L22 24 L32 34 L42 24 L46 42 Z" fill="url(#lipiGrad)" filter="url(#glow)" />
  <rect x="18" y="43" width="28" height="4" rx="2" fill="#00ffcc" />
  
  <!-- Jewels on Crown -->
  <circle cx="22" cy="23" r="2" fill="#ffffff" />
  <circle cx="32" cy="33" r="2.5" fill="#ffffff" />
  <circle cx="42" cy="23" r="2" fill="#ffffff" />
</svg>

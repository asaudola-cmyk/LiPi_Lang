name: "Feature Request"
description: "Propose a feature or improvement for Lipi."
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: "Problem / Motivation"
      description: "What use case or gap does this address?"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "Proposed Design"
      description: "Describe the proposed API, syntax, or behavior"
      render: text
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: "Category"
      options:
        - "Language Syntax & Semantics"
        - "Compiler & Codegen"
        - "Standard Library (utso/)"
        - "Packages & Toolchain (aati / lipilsp / lipidbg)"
        - "Platform Support"
        - "Performance"
    validations:
      required: true

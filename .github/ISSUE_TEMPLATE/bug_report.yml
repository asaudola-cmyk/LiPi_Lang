name: "🐛 Bug Report"
description: "লিপি কম্পাইলার বা স্ট্যান্ডার্ড লাইব্রেরিতে বাগ রিপোর্ট করুন।"
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 লিপি বাগ রিপোর্ট
        আপনার সমস্যার বিস্তারিত বিবরণ দিন।

  - type: textarea
    id: description
    attributes:
      label: "সমস্যার বিবরণ"
      description: "কী হচ্ছে এবং কী হওয়া উচিত ছিল?"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "পুনরুৎপাদনযোগ্য উদাহরণ (.lp কোড)"
      description: "ন্যূনতম কোড যা সমস্যাটি তৈরি করে"
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "প্রত্যাশিত আচরণ"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "প্রকৃত আচরণ (এরর মেসেজ বা আউটপুট)"
    validations:
      required: true

  - type: input
    id: lipi-version
    attributes:
      label: "লিপি সংস্করণ"
      description: "`./bin/lipic --version` এর আউটপুট"
      placeholder: "e.g. Lipi v1.0.0"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: "প্রভাবিত কম্পোনেন্ট"
      options:
        - "bin/lipic (কম্পাইলার)"
        - "bin/lipi (সেলফ-হোস্টেড কম্পাইলার)"
        - "std/ (স্ট্যান্ডার্ড লাইব্রেরি)"
        - "bin/lipipkg (প্যাকেজ ম্যানেজার)"
        - "bin/lipidbg (ডিবাগার)"
        - "bin/lipirepl (REPL)"
        - "অন্যান্য"
    validations:
      required: true

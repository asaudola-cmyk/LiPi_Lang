name: "Bug Report"
description: "Report a bug in the Lipi compiler, standard library, or toolchain."
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "What happened and what did you expect?"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "Minimal Reproduction (.lp code)"
      description: "Smallest .lp snippet that reproduces the issue"
      render: text
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Actual Output / Error"
    validations:
      required: true

  - type: input
    id: lipi-version
    attributes:
      label: "Lipi Version"
      description: "Output of `./bin/lipi --version` or commit hash"
      placeholder: "e.g. Lipi 1.0.0"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: "Affected Component"
      options:
        - "src/compiler (lipc)"
        - "src/tools/lipi (CLI)"
        - "utso/ (Standard Library)"
        - "aati/ (Packages & Package Manager)"
        - "lipilsp / lipifmt / lipidbg / lipirepl"
        - "Other"
    validations:
      required: true

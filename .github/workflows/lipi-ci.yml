name: Lipi Sovereign Native CI

# WHY: Lipi is 100% Sovereign (Zero Python, Zero Libc, Zero GCC).
# CI verifies standalone native bootstrap, 203 regression tests, zero-python audit,
# and end-to-end installer validation on clean Ubuntu environments.
# Triggered on every push/PR to main.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  native-regression-test:
    name: "Lipi 203-Test Regression Suite (Native Toolchain)"
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bootstrap Compiler and Developer Tools from Source
        run: |
          chmod +x src/boot/lipi-seed install.sh build.sh
          make

      - name: Show Lipi Native Version
        run: |
          ./bin/lipi version

      - name: Verify One-Liner Evaluation (Zero Foreign Runtime)
        run: |
          ./bin/lipi -e 'say "CI: Lipi Native Runner OK"'

      - name: Run Full 203-Test Sovereign Regression Engine (0% Shell)
        run: |
          ./bin/lipi test

      - name: Verify Direct Machine Code Compilation
        run: |
          ./bin/lipc tests/01_hello.lp /tmp/ci_hello
          /tmp/ci_hello
          rm -f /tmp/ci_hello

      - name: Verify Fibonacci Execution
        run: |
          ./bin/lipc tests/59_minimal_fibonacci.lp /tmp/ci_fib
          /tmp/ci_fib
          rm -f /tmp/ci_fib

      - name: Verify Unicode Execution
        run: |
          ./bin/lipc tests/56_minimal_unicode.lp /tmp/ci_unicode
          /tmp/ci_unicode
          rm -f /tmp/ci_unicode

  zero-dependency-audit:
    name: "Zero-Dependency Sovereignty Audit"
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Audit for Python Elimination in Core
        run: |
          echo "Auditing core directories (src, std, tests, bin) for Python files..."
          py_files=$(find src std tests bin -name "*.py" 2>/dev/null || true)
          if [ -n "$py_files" ]; then
            echo "❌ Sovereignty breach: Found Python files in core tree:"
            echo "$py_files"
            exit 1
          fi
          echo "✔ 100% Pure: Zero Python files in src, std, tests, bin!"

      - name: Audit for Bytecode Artifacts
        run: |
          pyc_files=$(find . -name "*.pyc" 2>/dev/null || true)
          if [ -n "$pyc_files" ]; then
            echo "❌ Found untracked or stale bytecode:"
            echo "$pyc_files"
            exit 1
          fi
          echo "✔ 100% Pure: Zero .pyc bytecode files!"

  installer-test:
    name: "Sovereign Installer Test"
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test install.sh bash & dash POSIX syntax
        run: |
          bash -n install.sh
          dash -n install.sh
          echo "install.sh syntax OK across bash and dash"

      - name: Test End-to-End Fresh Installation
        run: |
          chmod +x install.sh
          ./install.sh
          "$HOME/.local/bin/lipi" version
          "$HOME/.local/bin/lipc" --version
          echo "Fresh install test passed successfully!"

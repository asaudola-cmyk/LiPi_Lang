name: Lipi Tests

# WHY: CI runs all 60 tests using lipic2 (Python runtime)
# Triggered on every push/PR to main.
# Badge: [![Tests](https://github.com/asaudola-cmyk/LiPi_Lang/actions/workflows/lipi-ci.yml/badge.svg)](...)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    name: "Lipi 60-Test Suite (lipic2)"
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show Lipi version
        run: python3 -m src.runtime --version

      - name: Run test suite (tests/01-60)
        run: |
          passed=0
          failed=0
          fail_list=""

          for t in tests/[0-9][0-9]_*.lp; do
            [ -f "$t" ] || continue
            name=$(basename "$t")
            result=$(timeout 10 python3 -m src.runtime "$t" 2>&1 | tail -1)
            if echo "$result" | grep -q "PASS"; then
              echo "  ✅ $name"
              ((passed++))
            else
              echo "  ❌ $name → $result"
              fail_list="$fail_list\n  - $name"
              ((failed++))
            fi
          done

          echo ""
          echo "========================================"
          echo "Results: $passed PASS, $failed FAIL"
          echo "========================================"

          if [ "$failed" -gt 0 ]; then
            echo ""
            echo "Failed tests:$fail_list"
            exit 1
          fi

      - name: Verify lipi command works
        run: |
          chmod +x bin/lipi
          python3 -m src.runtime -e 'say "CI: lipi runtime ok"'

      - name: Run hello world
        run: |
          python3 -m src.runtime tests/01_hello.lp

      - name: Run fibonacci
        run: |
          python3 -m src.runtime tests/59_minimal_fibonacci.lp

      - name: Run unicode test
        run: |
          python3 -m src.runtime tests/56_minimal_unicode.lp

  install-test:
    name: "Install script test"
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test install.sh syntax
        run: bash -n install.sh && echo "install.sh syntax OK"

      - name: Test install.sh (local clone simulation)
        run: |
          # Simulate what install.sh does (skip git clone, use current dir)
          mkdir -p ~/.local/bin
          LIPI_HOME="$PWD"
          cat > ~/.local/bin/lipi << WRAPPER
          #!/bin/bash
          exec python3 -m src.runtime "\$@"
          WRAPPER
          chmod +x ~/.local/bin/lipi
          export PATH="$PATH:$HOME/.local/bin"
          python3 -m src.runtime -e 'say "install test ok"'
          echo "Install simulation: OK"

name: Lipi CI

# Verifies 3-stage Static-PIE deterministic bootstrap, W^X (0 RWE) audit across bin/*,
# 260 regression tests, 31/31 aati verify & aati.lock, utso/aati/examples compile sweeps,
# valid OPC .vsix packaging, --kavach toolchain dogfooding, Node V8 WASM execution,
# Shared .so + DWARF v4 (-g), Windows PE32+ execution, and macOS Mach-O verification.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  native-regression-test:
    name: "Static-PIE Bootstrap, W^X Audit & 260-Test Suite (Ubuntu)"
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js v20 for WASM Live Execution
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Stage-1 -> Stage-2 -> Stage-3 Deterministic Static-PIE Bootstrap & Build All Tools
        run: |
          chmod +x src/boot/lipi-seed install.sh build.sh
          make
          ./bin/lipc src/compiler/driver_cli.lp -o /tmp/lipc_s1
          /tmp/lipc_s1 src/compiler/driver_cli.lp -o /tmp/lipc_s2
          /tmp/lipc_s2 src/compiler/driver_cli.lp -o /tmp/lipc_s3
          cmp /tmp/lipc_s2 /tmp/lipc_s3
          rm -f /tmp/lipc_s1 /tmp/lipc_s2 /tmp/lipc_s3

      - name: Audit Static-PIE (ET_DYN) & Strict W^X (0 RWE) Across All bin/*
        run: |
          ./bin/lipi version
          for b in bin/*; do
            [ -f "$b" ] || continue
            etype=$(readelf -h "$b" | awk '/Type:/ {print $2}')
            rwe=$(readelf -l "$b" | grep -c 'RWE' || true)
            echo "$b: e_type=$etype, rwe=$rwe"
            test "$etype" = "DYN"
            test "$rwe" = "0"
          done

      - name: Run Full 260-Test Regression Suite
        run: |
          ./bin/lipi test

      - name: Verify Full Ecosystem Clean Compile Sweeps (utso + aati + examples)
        run: |
          for grp in utso aati examples; do
            for f in $(find "$grp" -name "*.lp" | sort); do
              ./bin/lipc "$f" -o /tmp/ci_sw_bin >/dev/null
            done
          done
          rm -f /tmp/ci_sw_bin

      - name: Verify Kavach Toolchain Dogfooding, Akhara Selftest & Bench Quick
        run: |
          ./bin/lipc src/tools/lipidoc.lp -o /tmp/ci_kv_doc --kavach
          ./bin/lipc src/tools/lipifmt.lp -o /tmp/ci_kv_fmt --kavach
          ./bin/lipc src/tools/lipi_akhara.lp -o /tmp/ci_kv_akh --kavach
          rm -f /tmp/ci_kv_doc /tmp/ci_kv_fmt /tmp/ci_kv_akh
          ./bin/lipi akhara --selftest
          ./bin/lipi bench --quick

      - name: Verify Strict Ownership & Memory Conservation Enforcement
        run: |
          printf 'x = 42\ny = move(x)\nsay x\n' > /tmp/ci_own_fail.lp
          ! ./bin/lipc --strict-ownership /tmp/ci_own_fail.lp -o /tmp/ci_own_fail
          rm -f /tmp/ci_own_fail.lp /tmp/ci_own_fail

      - name: Verify All 31/31 Aati Packages & Deterministic Lockfile
        run: |
          failed=0
          for d in aati/*/; do
            ./bin/aati verify "${d%/}" || failed=$((failed + 1))
          done
          test "$failed" = "0"
          ./bin/aati verify-lock aati.lock

      - name: Verify Live WebAssembly Execution in Node V8
        run: |
          printf 'fn add_sq a b\n    return (a * a) + (b * b)\nsay add_sq(3, 4)\n' > /tmp/ci_wasm.lp
          ./bin/lipc /tmp/ci_wasm.lp --target=wasm -o /tmp/ci_wasm.wasm
          node -e '
            const fs = require("fs");
            const wasm = fs.readFileSync("/tmp/ci_wasm.wasm");
            let memRef = null;
            let stdout = "";
            WebAssembly.instantiate(wasm, {
              wasi_snapshot_preview1: {
                fd_write: (_fd, iovs, iovsLen, nwritten) => {
                  if (memRef) {
                    const dv = new DataView(memRef.buffer);
                    let total = 0;
                    for (let i = 0; i < iovsLen; i++) {
                      const ptr = dv.getUint32(iovs + i * 8, true);
                      const len = dv.getUint32(iovs + i * 8 + 4, true);
                      stdout += Buffer.from(memRef.buffer, ptr, len).toString("utf8");
                      total += len;
                    }
                    dv.setUint32(nwritten, total, true);
                  }
                  return 0;
                }
              }
            }).then(r => {
              memRef = r.instance.exports.memory;
              const sret = r.instance.exports._start();
              if (sret !== undefined) process.exit(1);
              if (stdout !== "25\n") process.exit(2);
              const res = r.instance.exports.add_sq(3n, 4n);
              if (res !== 25n) process.exit(3);
              console.log("Node V8 WASM OK:", JSON.stringify(stdout), res.toString());
            });
          '
          rm -f /tmp/ci_wasm.lp /tmp/ci_wasm.wasm

      - name: Verify Shared Object (.so + ctypes) & DWARF v4 (-g)
        run: |
          printf 'fn fib_val n\n    if n <= 1\n        return n\n    a = 0\n    b = 1\n    i = 2\n    while i <= n\n        c = a + b\n        a = b\n        b = c\n        i = i + 1\n    return b\n' > /tmp/ci_so.lp
          ./bin/lipc --shared /tmp/ci_so.lp -o /tmp/ci_so.so
          test "$(readelf -l /tmp/ci_so.so | grep -c RWE || true)" = "0"
          python3 -c 'import ctypes; lib = ctypes.CDLL("/tmp/ci_so.so"); lib.fib_val.restype = ctypes.c_int64; lib.fib_val.argtypes = [ctypes.c_int64]; assert lib.fib_val(10) == 55'
          ./bin/lipc -g tests/01_hello.lp -o /tmp/ci_dw
          readelf --debug-dump=decodedline /tmp/ci_dw | grep -q "01_hello.lp"
          readelf --debug-dump=info /tmp/ci_dw | grep -q "DW_TAG_subprogram"
          rm -f /tmp/ci_so.lp /tmp/ci_so.so /tmp/ci_dw

      - name: Cross-Compile PE32+ Windows & Mach-O macOS Artifacts
        run: |
          mkdir -p /tmp/cross_artifacts
          printf 'args = argv()\nif args.len() < 1\n    exit(1)\nsay "CI: Windows PE32+ OK"\nok = file_write("ci_win_tmp.txt", "lipi_win64_ok")\nif ok == 0 or file_exists("ci_win_tmp.txt") == 0\n    exit(1)\nif file_read("ci_win_tmp.txt") != "lipi_win64_ok"\n    exit(2)\nif clock_ms() <= 0\n    exit(3)\nsay "CI: Windows File I/O + Clock Verified"\n' > /tmp/win_smoke.lp
          ./bin/lipc /tmp/win_smoke.lp --target windows -o /tmp/cross_artifacts/lipi_win_smoke.exe
          ./bin/lipc tests/01_hello.lp --target macos-arm64 -o /tmp/cross_artifacts/lipi_mac_smoke
          ./bin/lipc tests/01_hello.lp --target arm64 -o /tmp/cross_artifacts/lipi_arm64_smoke
          rm -f /tmp/win_smoke.lp

      - name: Upload Cross-Compiled Windows & macOS Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cross-platform-smoke-bins
          path: /tmp/cross_artifacts/

  windows-pe-live:
    name: "Native Windows PE32+ Execution (windows-latest)"
    needs: native-regression-test
    runs-on: windows-latest

    steps:
      - name: Download Cross-Compiled PE32+ Executable
        uses: actions/download-artifact@v8
        with:
          name: cross-platform-smoke-bins
          path: artifacts

      - name: Execute Lipi PE32+ Native Binary on Windows
        run: |
          ./artifacts/lipi_win_smoke.exe
          Remove-Item -Force -ErrorAction SilentlyContinue ci_win_tmp.txt

  macos-macho-verify:
    name: "macOS Mach-O Load Command & CodeSignature Verification (macos-latest)"
    needs: native-regression-test
    runs-on: macos-latest

    steps:
      - name: Download Cross-Compiled Mach-O Executable
        uses: actions/download-artifact@v8
        with:
          name: cross-platform-smoke-bins
          path: artifacts

      - name: Inspect Mach-O Headers, __LINKEDIT & LC_CODE_SIGNATURE
        run: |
          chmod +x artifacts/lipi_mac_smoke
          otool -hv artifacts/lipi_mac_smoke
          otool -l artifacts/lipi_mac_smoke | grep -E "LC_SEGMENT_64|__LINKEDIT|LC_CODE_SIGNATURE|LC_MAIN"

  zero-dependency-audit:
    name: "Zero-Dependency Audit"
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Audit for Python Elimination Across Repository
        run: |
          echo "Auditing repository directories (src, utso, aati, tests, bin, benchmarks, scripts) for Python files..."
          py_files=$(find src utso aati tests bin benchmarks scripts -name "*.py" 2>/dev/null || true)
          if [ -n "$py_files" ]; then
            echo "Found Python files in repository:"
            echo "$py_files"
            exit 1
          fi
          echo "Zero Python files in src, utso, aati, tests, bin, benchmarks, scripts"

      - name: Audit for Bytecode Artifacts
        run: |
          pyc_files=$(find . -name "*.pyc" 2>/dev/null || true)
          if [ -n "$pyc_files" ]; then
            echo "Found untracked or stale bytecode:"
            echo "$pyc_files"
            exit 1
          fi
          echo "Zero .pyc bytecode files"

  installer-test:
    name: "Installer Test"
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test install.sh bash & dash POSIX syntax
        run: |
          bash -n install.sh
          dash -n install.sh
          echo "install.sh syntax OK across bash and dash"

      - name: Test End-to-End Fresh Installation
        run: |
          chmod +x install.sh
          ./install.sh
          "$HOME/.local/bin/lipi" version
          "$HOME/.local/bin/lipc" --version
          "$HOME/.local/bin/lipi_akhara" --selftest
          echo "Fresh install test passed successfully!"
